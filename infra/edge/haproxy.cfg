# One public IPv4, one TCP 443: route by TLS SNI without decrypting anything.
#   turn.<domain>  -> LiveKit TURN/TLS (restrictive networks that only allow 443)
#   everything else -> Caddy (HTTPS + WSS signaling for rtc.<domain>)
global
  maxconn 2000

defaults
  mode tcp
  timeout connect 5s
  timeout client 1h   # long-lived media relays and WebSockets
  timeout server 1h
  default-server init-addr last,libc,none   # start even if a backend container isn't up yet

frontend tls_in
  bind :443
  # Flood guard. Docker Desktop hides client IPs (everyone arrives as the bridge gateway), so
  # this works as ONE shared budget, not per person: set well above real use (~4 calls at a
  # handful of connections each) and low enough that a flood can't exhaust Caddy or LiveKit.
  stick-table type ip size 1k expire 10m store conn_rate(10s),conn_cur
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc0_conn_rate gt 400 } || { sc0_conn_cur gt 300 }
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  # The ISP blocks inbound TCP 80, so certificates come over TLS-ALPN-01 on 443: Caddy must
  # answer the acme-tls/1 handshake for turn.<domain> too, before TURN traffic takes the name.
  use_backend web if { req.ssl_alpn acme-tls/1 }
  use_backend turn if { req.ssl_sni -m beg turn. }
  default_backend web

frontend http_in
  bind :80
  stick-table type ip size 1k expire 10m store conn_rate(10s)
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc0_conn_rate gt 100 }
  default_backend web_http

backend turn
  server livekit livekit:5349

backend web
  server caddy caddy:443

backend web_http
  server caddy caddy:80
