# Local / single-node LiveKit. `python gen-keys.py` first (writes the gitignored .env).
#   docker compose -f infra/video/docker-compose.yml up -d
# Production runs with host networking on a machine with a reachable public IP; Docker
# Desktop can't do host networking, so locally the ports are published explicitly.
services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    env_file: .env
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880" # signaling (WSS via the reverse proxy in production)
      - "127.0.0.1:7881:7881" # ICE/TCP
      - "127.0.0.1:50000-50100:50000-50100/udp" # media
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
